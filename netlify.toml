[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.19.0"
  # Environment variables are set in Netlify dashboard
  # OPENAI_API_KEY = "set in dashboard"
  # OPENAI_MODEL = "set in dashboard" 
  # EMBEDDINGS_MODEL = "set in dashboard"
  # MAKE_WEBHOOK_URL = "set in dashboard"
  # RESEND_API_KEY = "optional direct live-agent email delivery"
  # LIVE_AGENT_FROM_EMAIL = "verified sender, e.g. BrandGoto Website <website@brandgoto.com>"

# ONLY SPA ROUTING - NO SERVER-SIDE REDIRECTS
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# SECURITY HEADERS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; font-src 'self' https: data:; connect-src 'self' https://api.hubapi.com https://www.google-analytics.com https://www.googletagmanager.com https://ip-api.com;"

# Vite fingerprints production JS/CSS in /assets, so these resources are safe to cache immutably.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
